services:
  postgres:
    image: postgres:16
    container_name: campusfind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusfind
      POSTGRES_USER: campusfind
      POSTGRES_PASSWORD: campusfind
    ports:
      - "5432:5432"
    volumes:
      - campusfind-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfind -d campusfind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusfind-pgdata:
